const trs=v=>v.tr.map((s,k)=>`<div style="margin:4px 0"><span class="m">T${k+1}</span> <span class="seg">${ATS.map((a,i)=>`<button class="${s==i?'on s'+i:''}" onclick="setA('${v.id}',${k},${i})">${a}</button>`).join('')}</span> <button class="dng" onclick="delT('${v.id}',${k})">✕</button></div>`).join('');
function pVeh(){const act=[...Object.keys(SETS),'Eigene'].map(s=>{const l=S.veh.filter(v=>(v.set||'Eigene')==s);return l.length?`<h3>${s}</h3>${l.map(v=>`<div class="tile" style="cursor:default"><div><b>${esc(v.name)}</b><div class="m">${esc(an(v.area))} · ${v.tr.length} Trupp${v.tr.length==1?'':'s'}</div></div><span><button onclick="addT('${v.id}')">+ Trupp</button> <button class="dng" onclick="rv('${v.id}')">✕</button></span></div>`).join('')}`:''}).join('');
const tr=S.veh.filter(v=>v.tr.length).map(v=>`<div class="tile" style="cursor:default;align-items:flex-start"><b>${esc(v.name)}</b><div>${trs(v)}</div></div>`).join('');
return `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div><h2>Fahrzeugpool</h2>${pool('addV','addSet')}<div class="card"><h3>Eigenes Fahrzeug</h3><div class="row"><input id="cv" placeholder="Kennung / Name"><button onclick="custom()">+</button></div></div></div>
<div><h2>Im Einsatz (${S.veh.length})</h2><div class="card">${act||'<p class="m">Noch keine Fahrzeuge. Im Pool antippen.</p>'}</div><div class="card"><h3>Atemschutztrupps</h3>${tr||'<p class="m">Trupps erscheinen automatisch bei xx-48-xx. Weitere über „+ Trupp“.</p>'}</div></div></div>`}
const qa=(n,s)=>{av(n,s);save();render();vq()},qs=s=>{SETS[s].forEach(n=>av(n,s));save();render();vq()},qc=()=>{const n=$('cq').value.trim();if(n){av(n,'Eigene');save();render();vq()}};
function vq(){const t=$('mo').scrollTop;mdl(`<div class="row"><h2>Fahrzeug hinzufügen</h2><button class="pri" onclick="cm()">Fertig</button></div>${pool('qa','qs')}<div class="row"><input id="cq" placeholder="Eigenes Fahrzeug"><button onclick="qc()">+</button></div>`);$('mo').scrollTop=t}

/* ---------- Dashboard ---------- */
const areaV=id=>S.veh.filter(v=>v.area==id);
function moveV(id,a){const v=S.veh.find(x=>x.id==id);sel=null;if(v&&v.area!=a){log('Abschnitt',`${v.name}: ${an(v.area)} → ${an(a)}`);v.area=a;save()}render()}
const selV=id=>{sel=sel==id?null:id;render()},mv=a=>{if(sel)moveV(sel,a)},drop=(e,a)=>{e.preventDefault();moveV(e.dataTransfer.getData('t'),a)};
function addSub(){const n=(prompt('Name des Unterabschnitts')||'').trim();if(!n)return;S.areas.push({id:uid(),name:n,parent:'ga',c:PAL[S.areas.filter(a=>a.parent).length%6]});log('Abschnitt',`Unterabschnitt ${n} angelegt`);save();render()}
function delSub(id){if(!confirm('Unterabschnitt entfernen? Fahrzeuge gehen zurück in Gefahrenabwehr.'))return;areaV(id).forEach(v=>v.area='ga');log('Abschnitt',`Unterabschnitt ${A(id).name} entfernt`);S.areas=S.areas.filter(a=>a.id!=id);save();render()}
let dg=null;
function ds(e,id){e.preventDefault();e.stopPropagation();const g=document.createElement('div');g.className='ghost';g.textContent=V(id).name;document.body.appendChild(g);dg={id,g};e.currentTarget.setPointerCapture(e.pointerId);dmv(e)}
function dmv(e){if(!dg)return;dg.g.style.left=e.clientX+'px';dg.g.style.top=e.clientY+'px';document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));const a=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-a]');if(a)a.classList.add('hot');if(e.clientY>innerHeight-110)scrollBy(0,14);if(e.clientY<130)scrollBy(0,-14)}
function dend(e){if(!dg)return;const a=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-a]'),id=dg.id;dg.g.remove();dg=null;document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));if(a)moveV(id,a.dataset.a)}
function pDash(){const dt=v=>`<div class="tile ${sel==v.id?'sel':''}" onclick="event.stopPropagation();selV('${v.id}')"><span class="grip" onclick="event.stopPropagation()" onpointerdown="ds(event,'${v.id}')" onpointermove="dmv(event)" onpointerup="dend(event)" onpointercancel="dend(event)">⠿</span><b style="flex:1">${esc(v.name)}</b><span>${v.tr.map((s,k)=>`<span class="chip s${s}" onclick="event.stopPropagation();cyc('${v.id}',${k})">T${k+1} ${ATS[s]}</span>`).join('')}<span class="chip" onclick="event.stopPropagation();addT('${v.id}')">+ T</span></span></div>`;
const box=a=>`<div class="area" data-a="${a.id}" style="border-left:3px solid ${a.c}" onclick="mv('${a.id}')"><div class="row"><b>${esc(a.name)} <span class="m">${areaV(a.id).length}</span></b>${a.parent?`<button class="dng" onclick="event.stopPropagation();delSub('${a.id}')">✕</button>`:''}${a.id=='bs'?'<button class="pri" onclick="event.stopPropagation();vq()">+ Fahrzeug</button>':''}</div>${areaV(a.id).map(dt).join('')}</div>`;
const n=i=>S.veh.reduce((s,v)=>s+v.tr.filter(x=>x==i).length,0),tot=S.veh.reduce((s,v)=>s+v.tr.length,0);
const rc=ROLES.map(r=>[r,S.persons.filter(p=>(p.roles||[]).includes(r)).length]).filter(x=>x[1]).map(x=>`${x[0]}: ${x[1]}`).join(' · ');
return (sel?`<div class="card row" style="outline:2px solid var(--b)"><span>Gewählt: <b>${esc(V(sel).name)}</b> – Abschnitt antippen</span><button onclick="sel=null;render()">Abbrechen</button></div>`:'<p class="m">Fahrzeuge am Griff ⠿ in einen Abschnitt ziehen oder antippen und dann den Abschnitt antippen.</p>')+
`<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">${S.areas.filter(a=>!a.parent).map(a=>`<div class="card">${box(a)}${a.id=='ga'?S.areas.filter(x=>x.parent).map(box).join('')+'<button onclick="addSub()">+ Unterabschnitt</button>':''}</div>`).join('')}</div>
<div class="card"><h2>Analyse</h2><div class="kpi"><div><b>${S.veh.length}</b>Fahrzeuge</div><div><b>${tot}</b>Trupps</div><div class="s0"><b>${n(0)}</b>Bereit</div><div class="s1"><b>${n(1)}</b>Im Einsatz</div><div class="s2"><b>${n(2)}</b>Regeneration</div><div><b>${S.persons.length}</b>Personen</div></div>
${S.areas.map(a=>`<div class="row"><span style="border-left:3px solid ${a.c};padding-left:8px">${a.parent?'↳ ':''}${esc(a.name)}</span><b>${areaV(a.id).length}</b></div>`).join('')}${rc?`<p class="m">${rc}</p>`:''}</div>`}

/* ---------- Notizen / Tagebuch ---------- */
const NS=['Offen','Erledigt','Wichtig'];
function dl(){const q=flt.toLowerCase();return S.diary.filter(d=>(d.c+' '+d.t).toLowerCase().includes(q)).map(d=>`<div class="tile" style="cursor:default"><div><span class="m">${fmt(d.ts)}</span> <span class="chip ${d.c=='Manuell'?'on':''}">${esc(d.c)}</span><div>${esc(d.t)}</div></div></div>`).join('')||'<p class="m">Keine Einträge.</p>'}
function pNotes(){return `<div class="card"><h2>Schnellnotiz</h2><textarea oninput="S.quick=this.value;save()">${esc(S.quick)}</textarea><button class="pri" style="margin-top:8px" onclick="nq()">Als Notiz übernehmen</button></div>
<div class="card"><h2>Notizen</h2>${S.notes.map(n=>`<div class="tile" onclick="ne('${n.id}')"><div><span class="m">${fmt(n.ts)}</span><div>${esc(n.txt)}</div></div><span class="chip ${n.st==1?'s0':n.st==2?'s1':''}" onclick="event.stopPropagation();ns('${n.id}')">${NS[n.st]}</span></div>`).join('')||'<p class="m">Noch keine Notizen.</p>'}</div>
<div class="card"><h2>Einsatztagebuch</h2><div class="row"><input id="dm" placeholder="Manueller Eintrag"><button onclick="dmA()">Eintragen</button></div><label>Suche</label><input value="${esc(flt)}" oninput="flt=this.value;$('dl').innerHTML=dl()"><div id="dl">${dl()}</div></div>
${actCard()}`}
function nq(){if(!S.quick.trim())return;S.notes.unshift({id:uid(),ts:new Date().toISOString(),txt:S.quick,st:0});log('Notiz','Notiz erstellt');S.quick='';save();render()}
function ns(id){const n=S.notes.find(x=>x.id==id);n.st=(n.st+1)%3;log('Notiz',`Status: ${NS[n.st]}`);save();render()}
function ne(id){const n=S.notes.find(x=>x.id==id),t=prompt('Notiz bearbeiten',n.txt);if(t!==null&&t!=n.txt){n.txt=t;log('Notiz','Notiz geändert');save();render()}}
function dmA(){const v=$('dm').value.trim();if(v){log('Manuell',v);render()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`fw-einsatz-${(S.info.nr||new Date().toISOString().slice(0,10)).replace(/\W/g,'_')}.json`;a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.veh)||!Array.isArray(d.areas))throw 0;if(!confirm('Aktuellen Einsatz durch die Datei ersetzen?'))return;S=Object.assign(fresh(),d);mig();save();redraw();render()}catch(e){alert('Datei ungültig.')}};r.readAsText(f)}
const actCard=()=>`<div class="card"><h2>Einsatz abschließen</h2><div class="bar"><button class="pri" onclick="pdf()">PDF-Bericht</button><button onclick="exp()">JSON-Export</button><label class="btn" style="margin:0">JSON-Import<input type="file" hidden accept=".json" onchange="imp(this.files[0])"></label><button class="dng" onclick="newInc()">Einsatz löschen</button></div><p class="m">Erst PDF oder JSON sichern, dann löschen. Die Browser-Speicherung allein ist keine sichere Sicherung.</p></div>`;
function newInc(){if(!confirm('Diesen Einsatz endgültig löschen?\n\nPersonen, Fahrzeuge, Zeichnung, Notizen und Tagebuch gehen verloren. Vorher PDF oder JSON sichern!'))return;S=fresh();sel=null;flt='';save();redraw();go('info')}

/* ---------- Lagekarte ---------- */
let pc='#ff3b30',map,base=[],drawn=[],cur,mk,md='view';
const col=a=>A(a).c;
function initMap(){map=L.map('map').setView(S.info.lat?[S.info.lat,S.info.lng]:[51.16,10.45],S.info.lat?18:6);
base=[L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}),L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'})];base[0].addTo(map);
const c=map.getContainer();
c.addEventListener('pointerdown',e=>{if(md!='draw'||!e.isPrimary)return;cur=L.polyline([map.mouseEventToLatLng(e)],{color:pc,weight:4}).addTo(map);c.setPointerCapture(e.pointerId);e.preventDefault()});
c.addEventListener('pointermove',e=>{if(cur)cur.addLatLng(map.mouseEventToLatLng(e))});
const end=()=>{if(cur){S.draw.push({c:pc,pts:cur.getLatLngs().map(p=>[p.lat,p.lng])});drawn.push(cur);cur=null;save()}};
c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
map.on('click',e=>{if(md=='pos'){setPos(e.latlng.lat,e.latlng.lng);mode('view')}});redraw();if(S.info.lat)setPos(S.info.lat,S.info.lng,map.getZoom())}
function redraw(){if(!map)return;drawn.forEach(l=>map.removeLayer(l));drawn=S.draw.map(d=>L.polyline(d.pts,{color:d.c||col(d.a),weight:4}).addTo(map));if(mk){map.removeLayer(mk);mk=null}if(S.info.lat)setPos(S.info.lat,S.info.lng,map.getZoom())}
function setPos(la,ln,z=18){S.info.lat=la;S.info.lng=ln;save();map.setView([la,ln],z);if(mk)map.removeLayer(mk);mk=L.circleMarker([la,ln],{radius:9,color:'#fff',weight:3,fillColor:'#007aff',fillOpacity:1}).addTo(map)}
function pcol(b){pc=b.dataset.c;document.querySelectorAll('#sw button').forEach(x=>x.classList.toggle('on',x==b))}
function mode(m){md=m;document.querySelectorAll('#mm button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));if(map){m=='draw'?map.dragging.disable():map.dragging.enable();map.getContainer().style.touchAction=m=='draw'?'none':''}}
const lay=i=>{if(!map)return;base.forEach(b=>map.removeLayer(b));base[i].addTo(map);$('l0').classList.toggle('on',!i);$('l1').classList.toggle('on',!!i)};
const undo=()=>{if(drawn.length){map.removeLayer(drawn.pop());S.draw.pop();save()}},clr=()=>{if(S.draw.length&&confirm('Gesamte Zeichnung löschen?')){S.draw=[];redraw()}};
const gps=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>setPos(p.coords.latitude,p.coords.longitude),()=>alert('Standort nicht verfügbar. Adresse eingeben oder „Standort setzen“ nutzen.'),{enableHighAccuracy:true}):alert('Kein GPS verfügbar.');
const geo=()=>{if(!S.info.addr)return alert('Zuerst im Tab Informationen eine Adresse eintragen.');fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(S.info.addr)).then(r=>r.json()).then(j=>j[0]?setPos(+j[0].lat,+j[0].lon):alert('Adresse nicht gefunden.')).catch(()=>alert('Keine Internetverbindung.'))};
function mapShow(){if(typeof L=='undefined'){$('map').innerHTML='<p class="m" style="padding:20px">Die Karte braucht Internet (Leaflet nicht geladen).</p>';return}
if(!map)initMap();setTimeout(()=>map.invalidateSize(),60)}

function pdf(){const f=t=>new Date(t).toLocaleString('de-DE'),i=S.info,old=document.title;
const tb=(hd,rows)=>`<table><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
const order=[];S.areas.filter(a=>!a.parent).forEach(a=>{order.push(a);if(a.id=='ga')order.push(...S.areas.filter(x=>x.parent))});
const vr=[];order.forEach(a=>areaV(a.id).forEach(v=>vr.push([an(a.id),v.name,v.tr.map((s,k)=>`T${k+1}: ${ATS[s]}`).join(', ')||'–'])));
const n=k=>S.veh.reduce((a,v)=>a+v.tr.filter(x=>x==k).length,0);
document.title='Einsatzbericht_'+(i.nr||new Date().toISOString().slice(0,10)).replace(/\W/g,'_');
$('rep').innerHTML=`<h1>Einsatzbericht Feuerwehr</h1><div>Erstellt: ${f(new Date())}</div>
<h2>Einsatzdaten</h2>${tb(['Feld','Angabe'],[['Einsatznummer',i.nr||''],['Stichwort',i.kw||''],['Adresse',i.addr||''],['Einsatzleiter',i.el||''],['Beginn',i.start?f(i.start):'']])}
<h2>Analyse</h2>${tb(['Fahrzeuge','Trupps gesamt','Bereit','Im Einsatz','Regeneration','Personen'],[[S.veh.length,S.veh.reduce((a,v)=>a+v.tr.length,0),n(0),n(1),n(2),S.persons.length]])}
<h2>Fahrzeuge nach Abschnitt</h2>${vr.length?tb(['Abschnitt','Fahrzeug','Atemschutztrupps'],vr):'<p>Keine Fahrzeuge.</p>'}
<h2>Personen</h2>${S.persons.length?tb(['Name','Geburtsdatum','Adresse','Rollen','Notiz'],S.persons.map(p=>[pName(p),p.dob?new Date(p.dob).toLocaleDateString('de-DE'):'',p.addr||'',(p.roles||[]).concat(p.rfree?[p.rfree]:[]).join(', '),p.note||''])):'<p>Keine Personen.</p>'}
<h2>Notizen</h2>${S.notes.length?tb(['Zeit','Status','Notiz'],S.notes.slice().reverse().map(x=>[f(x.ts),NS[x.st],x.txt])):'<p>Keine Notizen.</p>'}
<h2>Einsatztagebuch</h2>${S.diary.length?tb(['Zeit','Kategorie','Eintrag'],S.diary.slice().reverse().map(d=>[f(d.ts),d.c,d.t])):'<p>Keine Einträge.</p>'}`;
window.onafterprint=()=>{document.title=old;$('rep').innerHTML=''};setTimeout(()=>print(),100)}

/* ---------- Rahmen ---------- */
const hdr=()=>$('hd').innerHTML=`<b>Einsatzleiter Feuerwehr</b><span>${esc([S.info.nr,S.info.addr].filter(Boolean).join(' · '))}</span>`;
const TABS=[['info','Informationen','📋'],['veh','Fahrzeuge','🚒'],['map','Lagekarte','🗺️'],['dash','Dashboard','📊'],['notes','Notizen','📝']];
function go(t){tab=t;sel=null;render()}
function render(){hdr();$('nav').innerHTML=TABS.map(([k,l,i])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
TABS.forEach(([k])=>$('p-'+k).hidden=k!=tab);const f={info:pInfo,veh:pVeh,dash:pDash,notes:pNotes}[tab];if(f)$('p-'+tab).innerHTML=f();if(tab=='map')mapShow()}
render();
</script><script>
/* Darstellung: Automatisch / Hell / Dunkel (nur Optik, gespeichert auf dem Gerät) */
(function(){
 var K="fwTheme";
 function get(){try{var t=localStorage.getItem(K);return(t==="light"||t==="dark")?t:"auto"}catch(e){return"auto"}}
 function apply(m){
  var r=document.documentElement;
  if(m==="light"||m==="dark")r.setAttribute("data-theme",m);else r.removeAttribute("data-theme");
  try{if(m==="auto")localStorage.removeItem(K);else localStorage.setItem(K,m)}catch(e){}
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(x){if(!x.dataset.orig)x.dataset.orig=x.getAttribute("content");x.setAttribute("content",m==="light"?"#f2f2f7":m==="dark"?"#000000":x.dataset.orig)});
 }
 function open(){
  var m=get();
  mdl('<div class="row"><h2>Darstellung</h2><button class="pri" onclick="cm()">Fertig</button></div><div class="seg wide" role="group" aria-label="Darstellung">'+
   [["auto","Automatisch"],["light","Hell"],["dark","Dunkel"]].map(function(x){return '<button class="'+(m===x[0]?'on':'')+'" aria-pressed="'+(m===x[0])+'" onclick="setTheme(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+
   '</div><p class="m" style="margin:10px 4px 0">Automatisch folgt der Einstellung des iPad.</p>');
 }
 window.setTheme=function(m){apply(m);open()};
 document.getElementById("themeBtn").addEventListener("click",open);
 apply(get());
})();
/* Nur Optik: ersetzt führende Textsymbole durch Symbole im SF-Stil */
(function(){
 var MAP={"✕":"xmark","✓":"checkmark","↩":"undo","📍":"location","⠿":"grip"},queued=false;
 function dress(){
  queued=false;
  document.querySelectorAll("button,.chip,.grip").forEach(function(el){
   var n=el.firstChild;if(!n||n.nodeType!==3)return;
   var t=n.nodeValue,i=t.search(/\S/);if(i<0)return;
   var ch=String.fromCodePoint(t.codePointAt(i)),name=MAP[ch];if(!name)return;
   n.nodeValue=t.slice(i+ch.length).replace(/^[\uFE0E\uFE0F]/,"").replace(/^\s+/,"");
   var sp=document.createElement("span");sp.className="sf";sp.setAttribute("data-sf",name);sp.setAttribute("aria-hidden","true");
   el.insertBefore(sp,n);
  });
 }
 function q(){if(!queued){queued=true;requestAnimationFrame(dress)}}
 new MutationObserver(q).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
 q();
})();
</script>
</body></html>
